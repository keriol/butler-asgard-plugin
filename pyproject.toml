[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butler-asgard"
version = "0.1.0.dev0"
description = "Provider-neutral Butler-owned ingress and identity projection"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "build>=1,<2"]
