name: Publish Asgard Public Alpha

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asgard-v0.1.0-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify public main and release preconditions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "0.1.0"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "false"
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; refusing tag replacement"
            exit 1
          fi
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 release already exists; refusing overwrite"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install "pytest>=9,<10" "build>=1,<2" "wheel>=0.45" "setuptools>=68"
      - name: Compile and run full tests
        run: |
          python -m compileall -q src tests examples
          python -m pip install --no-deps .
          python -m pytest -q
      - name: Build and audit packages
        run: |
          python -m build --wheel --sdist --no-isolation
          python scripts/audit_dist.py dist
      - name: Clean-room installation
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/asgard-wheel"
          "$RUNNER_TEMP/asgard-wheel/bin/python" -m pip install --no-deps --no-index --find-links dist butler-asgard
          "$RUNNER_TEMP/asgard-wheel/bin/python" -c "from importlib.metadata import version; assert version('butler-asgard') == '0.1.0'"
          python -m venv "$RUNNER_TEMP/asgard-sdist"
          "$RUNNER_TEMP/asgard-sdist/bin/python" -m pip install --no-deps dist/*.tar.gz
          "$RUNNER_TEMP/asgard-sdist/bin/python" -c "from importlib.metadata import version; assert version('butler-asgard') == '0.1.0'"
      - name: Verify remote main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Create annotated tag and GitHub pre-release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "keriol"
          git config user.email "259832917+keriol@users.noreply.github.com"
          git tag -a v0.1.0 -m "Butler Asgard Plugin 0.1.0 Public Alpha"
          git push origin refs/tags/v0.1.0
          test "$(git rev-parse v0.1.0^{commit})" = "$(git rev-parse HEAD)"
          gh release create v0.1.0 dist/*.whl dist/*.tar.gz --verify-tag --prerelease --title "Butler Asgard Plugin 0.1.0 Public Alpha" --notes-file docs/RELEASE_0.1.0.md
      - name: Verify remote release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v0.1.0 --json isPrerelease --jq .isPrerelease)" = "true"
          test "$(gh release view v0.1.0 --json assets --jq '.assets | length')" = "2"
          test "$(git ls-remote origin refs/tags/v0.1.0 | wc -l)" -eq 1
          gh release view v0.1.0 --json url,assets,tagName --jq '{url,tagName,assets:[.assets[].name]}'
